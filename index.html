<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Profesional de Constelaciones Familiares</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans overflow-hidden select-none">

  <!-- Header & Main Controls -->
  <header class="bg-slate-800 border-b border-slate-700 px-5 py-2.5 flex justify-between items-center shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
      </div>
      <div>
        <h1 class="font-bold text-base text-slate-100 leading-tight">Campo Sistémico Pro</h1>
        <p class="text-[10px] text-slate-400">Constelaciones Familiares & Diagnóstico Transgeneracional</p>
      </div>
    </div>

    <!-- Actions & History Toolbar -->
    <div class="flex items-center gap-1.5 text-xs">
      <button onclick="undo()" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded transition flex items-center gap-1 text-slate-300" title="Deshacer (Ctrl+Z)">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-0.78C21.08 11.03 17.15 8 12.5 8z"/></svg> Undo
      </button>

      <button onclick="redo()" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded transition flex items-center gap-1 text-slate-300" title="Rehacer">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.97 7.22L3.9 16c1.05-3.19 4.06-5.5 7.6-5.5 1.96 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg> Redo
      </button>

      <div class="h-4 w-px bg-slate-700 mx-1"></div>

      <button onclick="toggleLineMode()" id="lineModeBtn" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition flex items-center gap-1.5 text-slate-200 border border-transparent">
        <svg class="w-3.5 h-3.5 fill-current text-indigo-400" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg> Conectar Línea
      </button>

      <button onclick="saveLocal()" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded transition text-slate-300">Guardar</button>
      <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded transition text-emerald-400">Exportar JSON</button>
      <label class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded transition text-amber-400 cursor-pointer">
        Importar JSON <input type="file" id="jsonFile" accept=".json" class="hidden" onchange="importJSON(event)">
      </label>

      <div class="h-4 w-px bg-slate-700 mx-1"></div>

      <button onclick="exportPNG()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded font-semibold transition shadow">PNG</button>
      <button onclick="printReport()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded font-semibold transition shadow">Reporte / PDF</button>
      <button onclick="clearAll()" class="bg-rose-900/40 hover:bg-rose-800 text-rose-300 px-2.5 py-1.5 rounded transition">Limpiar</button>
    </div>
  </header>

  <!-- Work Area -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Catalog Sidebar -->
    <aside class="w-80 bg-slate-800/90 border-r border-slate-700 flex flex-col shrink-0">
      <div class="p-3 border-b border-slate-700 space-y-2">
        <input type="text" id="searchInput" placeholder="Buscar entre +110 arquetipos..." 
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500 text-slate-200"
               oninput="renderCatalog()">
        
        <div class="flex gap-1 overflow-x-auto pb-1 text-[11px]" id="catTabs">
          <button onclick="setCategory('all', event)" class="cat-btn bg-indigo-600 text-white px-2 py-0.5 rounded">Todos</button>
          <button onclick="setCategory('mujeres', event)" class="cat-btn bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Mujeres</button>
          <button onclick="setCategory('hombres', event)" class="cat-btn bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Hombres</button>
          <button onclick="setCategory('ancianos', event)" class="cat-btn bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Ancianos</button>
          <button onclick="setCategory('ninos', event)" class="cat-btn bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Niños/Bebés</button>
          <button onclick="setCategory('roles', event)" class="cat-btn bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Roles</button>
          <button onclick="setCategory('animales', event)" class="cat-btn bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Animales</button>
          <button onclick="setCategory('conceptos', event)" class="cat-btn bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Conceptos</button>
        </div>
      </div>

      <div id="catalogList" class="flex-1 overflow-y-auto p-2.5 grid grid-cols-2 gap-2 text-xs"></div>
    </aside>

    <!-- Main Clock Field Container -->
    <main class="starfield flex-1 bg-slate-950 flex items-center justify-center relative p-4 overflow-hidden">
      
      <!-- Info Badge -->
      <div class="absolute top-3 left-4 bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-lg text-xs flex gap-3 text-slate-400 z-10">
        <span>Elementos: <b id="elemCounter" class="text-indigo-400">0</b></span>
        <span>Líneas: <b id="lineCounter" class="text-indigo-400">0</b></span>
        <span id="statusHint" class="text-amber-400 font-medium"></span>
      </div>

      <!-- Clock Surface -->
      <div id="clockBoard" class="clock-board relative rounded-full flex items-center justify-center">
        
        <!-- SVG Connections Layer -->
        <svg id="svgLines" class="absolute inset-0 w-full h-full pointer-events-none z-10"></svg>

        <!-- Center Origin -->
        <div class="clock-center absolute z-0"></div>

        <!-- Hours (12 positions) -->
        <div class="clock-hour clock-hour-12">12</div>
        <div class="clock-hour clock-hour-1">1</div>
        <div class="clock-hour clock-hour-2">2</div>
        <div class="clock-hour clock-hour-3">3</div>
        <div class="clock-hour clock-hour-4">4</div>
        <div class="clock-hour clock-hour-5">5</div>
        <div class="clock-hour clock-hour-6">6</div>
        <div class="clock-hour clock-hour-7">7</div>
        <div class="clock-hour clock-hour-8">8</div>
        <div class="clock-hour clock-hour-9">9</div>
        <div class="clock-hour clock-hour-10">10</div>
        <div class="clock-hour clock-hour-11">11</div>

        <!-- Concentric Guideline Circles -->
        <div class="clock-ring clock-ring-outer absolute pointer-events-none"></div>
        <div class="clock-ring clock-ring-inner absolute pointer-events-none"></div>

        <!-- Nodes Arena Layer -->
        <div id="fieldArena" class="absolute inset-0 rounded-full"></div>
      </div>

      <!-- Node Control Inspector -->
      <div id="inspector" class="hidden absolute top-4 right-4 bg-slate-900 border border-slate-700 p-3.5 rounded-xl shadow-2xl w-72 text-xs z-30 space-y-3">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="font-bold text-slate-200">Propiedades del Elemento</h3>
          <button onclick="deselectNode()" class="text-slate-500 hover:text-slate-300">✕</button>
        </div>

        <div>
          <label class="block text-slate-400 text-[10px] uppercase mb-1">Nombre / Rol</label>
          <input type="text" id="inspLabel" oninput="updateNodeProps()" onchange="pushState()" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-slate-100">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 text-[10px] uppercase mb-1">Mirada (<span id="inspDeg">0</span>°)</label>
            <input type="range" id="inspRot" min="0" max="360" value="0" oninput="updateNodeProps()" onchange="pushState()" class="w-full accent-indigo-500">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px] uppercase mb-1">Escala (<span id="inspScaleVal">1.0</span>x)</label>
            <input type="range" id="inspScale" min="0.6" max="1.8" step="0.1" value="1.0" oninput="updateNodeProps()" onchange="pushState()" class="w-full accent-indigo-500">
          </div>
        </div>

        <div class="pt-1">
          <button onclick="deleteSelectedNode()" class="w-full bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 py-1 rounded transition font-medium">Eliminar Elemento</button>
        </div>
      </div>
    </main>

    <!-- Session Notes & Healing Phrases Sidebar -->
    <aside class="w-80 bg-slate-800/90 border-l border-slate-700 flex flex-col shrink-0">
      <div class="p-3 border-b border-slate-700">
        <h2 class="font-bold text-xs uppercase tracking-wider text-slate-300">Bitácora & Frases Sanadoras</h2>
      </div>

      <div class="p-3 space-y-3 flex-1 flex flex-col overflow-y-auto text-xs">
        <div>
          <label class="block text-slate-400 text-[10px] uppercase mb-1">Cliente / Motivo de Consulta</label>
          <input type="text" id="sessionClient" placeholder="Nombre del cliente o tema..." class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200">
        </div>

        <div class="flex-1 flex flex-col">
          <label class="block text-slate-400 text-[10px] uppercase mb-1">Notas de Observación Sistémica</label>
          <textarea id="sessionNotes" placeholder="Registra las lealtades, exclusiones o movimientos del campo..." class="w-full flex-1 bg-slate-900 border border-slate-700 rounded p-2.5 text-slate-200 resize-none min-h-[140px]"></textarea>
        </div>

        <div>
          <label class="block text-slate-400 text-[10px] uppercase mb-1">Insertar Frase Sanadora</label>
          <div class="grid grid-cols-1 gap-1.5">
            <button onclick="insertPhrase('Te veo y te honro en mi corazón.')" class="text-left bg-slate-900 hover:bg-slate-700 p-1.5 rounded border border-slate-700 text-[11px] text-indigo-300">"Te veo y te honro en mi corazón."</button>
            <button onclick="insertPhrase('Tomo de ti la vida al precio que te costó.')" class="text-left bg-slate-900 hover:bg-slate-700 p-1.5 rounded border border-slate-700 text-[11px] text-indigo-300">"Tomo de ti la vida al precio que te costó."</button>
            <button onclick="insertPhrase('Tú eres el grande, yo soy el pequeño.')" class="text-left bg-slate-900 hover:bg-slate-700 p-1.5 rounded border border-slate-700 text-[11px] text-indigo-300">"Tú eres el grande, yo soy el pequeño."</button>
            <button onclick="insertPhrase('Te devuelvo tu carga con amor y respeto.')" class="text-left bg-slate-900 hover:bg-slate-700 p-1.5 rounded border border-slate-700 text-[11px] text-indigo-300">"Te devuelvo tu carga con amor y respeto."</button>
            <button onclick="insertPhrase('Restablezco tu lugar en nuestro sistema.')" class="text-left bg-slate-900 hover:bg-slate-700 p-1.5 rounded border border-slate-700 text-[11px] text-indigo-300">"Restablezco tu lugar en nuestro sistema."</button>
          </div>
        </div>
      </div>
    </aside>

  </div>

  <!-- Offscreen Canvas & Print Report container -->
  <canvas id="exportCanvas" class="hidden"></canvas>
  <div id="printableReport" class="p-8 bg-white text-slate-900 hidden"></div>

  <!-- Scripts -->
  <script src="js/svg-icons.js"></script>
  <script src="js/archetypes.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
